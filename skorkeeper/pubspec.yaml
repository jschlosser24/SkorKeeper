name: skorkeeper
description: "SkorKeeper — All-In-One Scoring & Game Tools App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.6.3
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  flutter_bloc: ^9.0.0
  bloc: ^9.0.0
  drift: ^2.25.0
  sqlite3_flutter_libs: ^0.5.28
  shared_preferences: ^2.5.3
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  rive: ^0.13.20
  sensors_plus: ^6.1.1
  just_audio: ^0.9.46
  audio_session: ^0.1.22
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  collection: ^1.19.1
  intl: ^0.20.2
  flutter_svg: ^2.0.17
  path_provider: ^2.1.4
  path: ^1.9.0
  url_launcher: ^6.3.1
  purchases_flutter: ^10.7.0
  google_mobile_ads: ^6.0.0
  connectivity_plus: ^7.3.1
  app_tracking_transparency: ^2.0.7
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.1
  drift_dev: ^2.25.0
  freezed: ^3.0.0
  json_serializable: ^6.9.5
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/sounds/classic/
    - assets/sounds/arcade/
    - assets/sounds/nature/
    - assets/sounds/jazz/
    - assets/sounds/minimal/
    - assets/sounds/epic/
    - assets/sounds/neon/
    - assets/sounds/sports/
    - assets/fonts/
